name: Build Eyeniq RustDesk Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: RustDesk 1.4.9 ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      RUSTDESK_HOST: rust.eyeniq.com
      VERSION_NAME: "1.4.9"
      VERSION_CODE: "67"
      ANDROID_ABI: arm64-v8a
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout official RustDesk 1.4.9
        uses: actions/checkout@v6
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            jq yq libayatana-appindicator3-dev libasound2-dev libc6-dev \
            libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev \
            libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm \
            ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true

      - name: Patch RustDesk 1.4.9 bridge Flutter version
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path(".github/workflows/bridge.yml")
          s = p.read_text(encoding="utf-8")
          if "  FLUTTER_VERSION:" not in s:
              m = re.search(r'flutter-version:\s*"([^"]+)"', s)
              if not m:
                  raise SystemExit("Could not detect default bridge Flutter version")
              version = m.group(1)
              if "env:\n" not in s:
                  raise SystemExit("Could not find bridge.yml env section")
              s = s.replace("env:\n", f'env:\n  FLUTTER_VERSION: "{version}"\n', 1)
              p.write_text(s, encoding="utf-8")
              print(f"Injected FLUTTER_VERSION={version}")
          PY
          BRIDGE_FLUTTER_VERSION="$(yq -r .env.FLUTTER_VERSION .github/workflows/bridge.yml)"
          test -n "$BRIDGE_FLUTTER_VERSION"
          test "$BRIDGE_FLUTTER_VERSION" != "null"
          echo "Bridge Flutter version: $BRIDGE_FLUTTER_VERSION"

      # build_fdroid.sh otherwise builds the newest vcpkg-tool against this
      # tag's pinned vcpkg source. That pair is incompatible on current runners.
      - name: Bootstrap RustDesk-pinned vcpkg
        shell: bash
        run: |
          set -euxo pipefail
          VCPKG_COMMIT_ID="$(yq -r '.env.VCPKG_COMMIT_ID' .github/workflows/flutter-build.yml)"
          test -n "$VCPKG_COMMIT_ID"
          test "$VCPKG_COMMIT_ID" != "null"
          export VCPKG_ROOT="$HOME/vcpkg"
          test ! -e "$VCPKG_ROOT"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT_ID"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" version

      - name: Prepare RustDesk Android toolchain and bridge
        shell: bash
        run: |
          set -euxo pipefail
          bash flutter/build_fdroid.sh \
            "$VERSION_NAME" "$VERSION_CODE" "$ANDROID_ABI" prebuild

      - name: Embed Eyeniq ID server and public key
        shell: bash
        run: |
          set -euxo pipefail
          RUSTDESK_KEY="$(curl -fsSL 'https://raw.githubusercontent.com/park-seokjae/rustdesk/3a5f8cb11904e454787385c7bebf228ad5d8f140/.github/workflows/build-eyeniq-rustdesk.yml' | sed -n 's/^[[:space:]]*RUSTDESK_KEY:[[:space:]]*//p' | head -n 1)"
          test -n "$RUSTDESK_KEY"
          export RUSTDESK_KEY
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          p = Path("libs/hbb_common/src/config.rs")
          s = p.read_text(encoding="utf-8")
          host = os.environ["RUSTDESK_HOST"]
          key = os.environ["RUSTDESK_KEY"]
          s, n_host = re.subn(
              r'pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*&\[[^;]*\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{host}"];',
              s,
              count=1,
          )
          s, n_key = re.subn(
              r'pub const RS_PUB_KEY:\s*&str\s*=\s*"[^"]*";',
              f'pub const RS_PUB_KEY: &str = "{key}";',
              s,
              count=1,
          )
          if n_host != 1 or n_key != 1:
              raise SystemExit(f"Patch failed: RENDEZVOUS_SERVERS={n_host}, RS_PUB_KEY={n_key}")
          p.write_text(s, encoding="utf-8")

          # RustDesk's mobile settings page reads persisted options only. Keep the
          # compiled defaults for actual connections and prefill the visible fields too.
          dart = Path("flutter/lib/common.dart")
          d = dart.read_text(encoding="utf-8")
          old_ui = '''  ServerConfig.fromOptions(Map<String, dynamic> options)
      : idServer = options['custom-rendezvous-server'] ?? "",
        relayServer = options['relay-server'] ?? "",
        apiServer = options['api-server'] ?? "",
        key = options['key'] ?? "";'''
          new_ui = f'''  ServerConfig.fromOptions(Map<String, dynamic> options)
      : idServer = (options['custom-rendezvous-server'] ?? "").toString().trim().isEmpty
          ? {json.dumps(host)}
          : (options['custom-rendezvous-server'] ?? "").toString(),
        relayServer = options['relay-server'] ?? "",
        apiServer = options['api-server'] ?? "",
        key = (options['key'] ?? "").toString().trim().isEmpty
          ? {json.dumps(key)}
          : (options['key'] ?? "").toString();'''
          if old_ui not in d:
              raise SystemExit("Patch failed: mobile ServerConfig.fromOptions")
          dart.write_text(d.replace(old_ui, new_ui, 1), encoding="utf-8")

          print(f"Embedded host: {host}")
          print("Embedded public key: yes")
          print("Prefilled mobile server settings: yes")
          PY

      - name: Use an installable CI signing key
        shell: bash
        run: |
          set -euxo pipefail
          sed -i \
            's/signingConfig signingConfigs\.release/signingConfig signingConfigs.debug/g' \
            flutter/android/app/build.gradle
          grep -n 'signingConfig' flutter/android/app/build.gradle || true

      - name: Build ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          bash flutter/build_fdroid.sh \
            "$VERSION_NAME" "$VERSION_CODE" "$ANDROID_ABI" build

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find flutter/build/app/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Eyeniq-RustDesk-1.4.9-arm64.apk
          sha256sum Eyeniq-RustDesk-1.4.9-arm64.apk | tee Eyeniq-RustDesk-1.4.9-arm64.apk.sha256
          ls -lh Eyeniq-RustDesk-1.4.9-arm64.apk*

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eyeniq-RustDesk-1.4.9-arm64
          path: |
            Eyeniq-RustDesk-1.4.9-arm64.apk
            Eyeniq-RustDesk-1.4.9-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
